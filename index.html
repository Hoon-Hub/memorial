<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f8f7f4"><meta name="robots" content="noindex,nofollow"><title>부고 안내</title><meta name="description" content="부고 안내 페이지"><style>
*{box-sizing:border-box}body{margin:0;background:#f8f7f4;color:#292929;font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;line-height:1.75}.wrap{max-width:540px;margin:auto;padding:56px 24px 72px;text-align:center}.flower{font-size:60px;color:#777;margin:16px 0 32px}.eyebrow{letter-spacing:.14em;font-size:clamp(44px,12vw,64px);font-family:serif;font-weight:600;color:#29241e;line-height:1.25}.heading{font-size:30px;font-weight:500;letter-spacing:.12em;margin:18px 0 28px}.intro{font-size:15px;line-height:2;color:#555;margin-bottom:40px;white-space:pre-line}.section{padding:25px 0;border-top:1px solid #dedbd6}.section h2{font-size:16px;font-weight:600;margin:0 0 15px}.family-list{margin:12px 0 0;text-align:left}.family-row{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;align-items:start;padding:18px 0;border-bottom:1px solid #dedbd6}.family-row:last-child{border-bottom:0}.family-label{color:#827a6b}.family-names{font-weight:600;overflow-wrap:anywhere}.detail{display:grid;grid-template-columns:85px 1fr;gap:12px;text-align:left;font-size:14px;margin:12px 0}.detail dt{color:#777}.detail dd{margin:0;white-space:pre-line;overflow-wrap:anywhere}.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}.btn,button{font:inherit;font-size:13px;background:transparent;color:#333;border:1px solid #c9c5be;border-radius:6px;padding:10px 14px;text-decoration:none;cursor:pointer}.note{font-size:14px;margin-top:50px}footer{font-size:12px;color:#888;margin-top:35px}[hidden]{display:none!important}</style></head>
<body><main class="wrap"><div class="flower" aria-hidden="true">✿</div><div class="eyebrow">訃 告</div><h1 class="heading">부고 안내</h1><div class="intro" id="message"></div><section class="section"><h2 id="name"></h2><dl><div class="detail"><dt>별세</dt><dd id="passed"></dd></div><div class="detail"><dt>빈소</dt><dd id="hall"></dd></div><div class="detail"><dt>발인</dt><dd id="departure"></dd></div><div class="detail"><dt>장지</dt><dd id="burial"></dd></div></dl></section><section class="section"><h2>— 상주 —</h2><div id="family" class="family-list"></div></section><section class="section"><h2>오시는 길</h2><div id="address"></div><div class="actions"><a class="btn" id="map" target="_blank" rel="noopener noreferrer">지도에서 보기</a><a class="btn" id="phone">장례식장 전화</a></div></section><section class="section" id="accountSection"><h2>마음 전하실 곳</h2><div id="account"></div><div class="actions"><button id="copyAccount">계좌번호 복사</button></div></section><div class="actions" style="margin-top:36px"><button id="share">부고장 공유</button><button id="copyLink">주소 복사</button></div><p class="note"><strong>근조화환은 정중히 사양합니다.</strong><br>조문해 주시는 마음만으로도 깊이 감사드립니다.</p><p>삼가 고인의 명복을 빕니다.</p><footer>마음을 전해주시는 모든 분께 감사드립니다.</footer></main>
<script src="./config.js"></script><script>
const d=window.MEMORIAL||{};const $=id=>document.getElementById(id);const val=v=>v||'추후 안내 예정';for(const k of ['name','passed','hall','departure','burial','address'])$(k).textContent=val(d[k]);const familyRows=(d.family||'').split('\n').map(line=>line.split(/:\s*/)).filter(parts=>parts.length>=2);const familyGroups=[['배우자',familyRows.filter(p=>p[0]==='배우자').map(p=>p.slice(1).join(':'))],['아들',familyRows.filter(p=>p[0].includes('장남')||p[0]==='아들').map(p=>p.slice(1).join(':'))],['자부',familyRows.filter(p=>p[0]==='며느리'||p[0]==='자부').map(p=>p.slice(1).join(':'))]];for(const [label,names] of familyGroups){if(!names.length)continue;const row=document.createElement('div');row.className='family-row';const left=document.createElement('span');left.className='family-label';left.textContent=label;const right=document.createElement('span');right.className='family-names';right.textContent=names.join(', ');row.append(left,right);$('family').append(row);}$('message').textContent=d.message||'삼가 부고를 전합니다.\n장례 일정은 확정되는 대로 안내드리겠습니다.';$('map').href=d.address?'https://map.naver.com/p/search/'+encodeURIComponent(d.address):'#';$('phone').href=d.phone?'tel:'+d.phone:'#';if(!d.phone)$('phone').hidden=true;if(!d.address)$('map').hidden=true;if(!d.account)$('accountSection').hidden=true;else $('account').textContent=[d.bank,d.account,d.accountHolder].filter(Boolean).join(' ');const copy=async t=>{try{await navigator.clipboard.writeText(t);alert('복사되었습니다.')}catch{prompt('아래 내용을 복사하세요.',t)}};$('copyAccount').onclick=()=>copy([d.bank,d.account,d.accountHolder].filter(Boolean).join(' '));$('copyLink').onclick=()=>copy(location.href);$('share').onclick=async()=>{if(navigator.share){try{await navigator.share({title:'부고 안내',text:(d.name||'')+' 부고 안내',url:location.href})}catch{}}else copy(location.href)};
</script></body></html>
